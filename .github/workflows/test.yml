name: Tests
run-name: Run status-keycard-qt tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version (dependent on docker image)'
        required: false
        default: '6.11.0'
        type: string

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Run Tests
    container:
      image: harbor.status.im/status-im/status-desktop-build:20260901-qt6.11.0
      options: --user root
    env:
      QT_VERSION: ${{ inputs.qt_version || '6.11.0' }}
      QT_HOST: gcc_64
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clean workspace if retrying job
        if: ${{ github.run_attempt > 1 }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git reset --hard
          git clean -xfd

      - name: Setup environment
        run: |
          set -e
          QT_PATH="/opt/qt/${{ env.QT_VERSION }}/gcc_64"
          echo "QT_PATH=$QT_PATH" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$QT_PATH" >> $GITHUB_ENV
          echo "Qt6_DIR=$QT_PATH/lib/cmake/Qt6" >> $GITHUB_ENV
          echo "$QT_PATH/bin" >> $GITHUB_PATH
          test -d "$QT_PATH"

      - name: Install dependencies
        run: |
          set -e
          apt-get update -qq
          apt-get install -y libpcsclite-dev libssl-dev pkg-config

      - name: Build
        run: |
          set -e
          EXTRA_CMAKE_ARGS=""
          if [ -n "${KEYCARD_QT_LOCAL_PATH:-}" ]; then
            EXTRA_CMAKE_ARGS="-DKEYCARD_QT_SOURCE_DIR=$KEYCARD_QT_LOCAL_PATH"
          fi
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}" \
            -DQt6_DIR="${{ env.Qt6_DIR }}" \
            -DBUILD_TESTING=ON \
            $EXTRA_CMAKE_ARGS
          cmake --build . -j$(nproc)

      - name: Test
        run: |
          set -e
          cd build
          ctest --output-on-failure --verbose

      - name: Test log
        if: always()
        run: cat build/Testing/Temporary/LastTest.log 2>/dev/null || true

  integration:
    runs-on: ubuntu-24.04
    name: Integration Tests (jcardsim)
    container:
      image: harbor.status.im/status-im/status-desktop-build:20260901-qt6.11.0
      options: --user root
    env:
      QT_VERSION: ${{ inputs.qt_version || '6.11.0' }}
      QT_HOST: gcc_64
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup environment
        run: |
          set -e
          QT_PATH="/opt/qt/${{ env.QT_VERSION }}/gcc_64"
          echo "QT_PATH=$QT_PATH" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$QT_PATH" >> $GITHUB_ENV
          echo "Qt6_DIR=$QT_PATH/lib/cmake/Qt6" >> $GITHUB_ENV
          echo "$QT_PATH/bin" >> $GITHUB_PATH
          test -d "$QT_PATH"

      - name: Install dependencies
        run: |
          set -e
          apt-get update -qq
          apt-get install -y libpcsclite-dev libssl-dev pkg-config default-jdk-headless

      - name: Build simulator
        working-directory: test/keycard-simulator
        run: ./build.sh

      - name: Build
        run: |
          set -e
          mkdir -p build-integration && cd build-integration
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}" \
            -DQt6_DIR="${{ env.Qt6_DIR }}" \
            -DBUILD_TESTING=ON \
            -DUSE_SIMULATED_KEYCARD=ON \
            -DBUILD_INTEGRATION_TESTS=ON
          cmake --build . -j$(nproc)

      - name: Test
        run: |
          set -e
          cd build-integration
          ctest -L integration --no-tests=error --output-on-failure

      - name: Test log
        if: always()
        run: cat build-integration/Testing/Temporary/LastTest.log 2>/dev/null || true

  android-build:
    runs-on: ubuntu-24.04
    name: Android Build Verification
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    container:
      image: harbor.status.im/status-im/status-desktop-build:20260829-qt6.11.0-android
      options: --user jenkins
    env:
      QT_VERSION: ${{ inputs.qt_version || '6.11.0' }}
      ANDROID_ABI: arm64-v8a
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Android
        run: |
          set -e
          QT_ANDROID_PATH="/opt/qt/${{ env.QT_VERSION }}/android_arm64_v8a"
          QT_HOST_PATH="/opt/qt/${{ env.QT_VERSION }}/gcc_64"
          test -d "$QT_ANDROID_PATH"
          test -d "$QT_HOST_PATH"
          echo "QT_ANDROID_PATH=$QT_ANDROID_PATH" >> $GITHUB_ENV
          echo "QT_HOST_PATH=$QT_HOST_PATH" >> $GITHUB_ENV
          echo "QT_DIR=$QT_ANDROID_PATH" >> $GITHUB_ENV
          echo "QTDIR=$QT_ANDROID_PATH" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$QT_ANDROID_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/opt/android-sdk/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "$QT_ANDROID_PATH/bin" >> $GITHUB_PATH
          echo "$QT_HOST_PATH/bin" >> $GITHUB_PATH

      - name: Verify OpenSSL
        run: |
          set -e
          OPENSSL_DIR="/home/jenkins/openssl-output/${ANDROID_ABI}"
          test -f "$OPENSSL_DIR/lib/libcrypto.a"
          test -d "$OPENSSL_DIR/include/openssl"

      - name: Build
        run: |
          set -e
          OPENSSL_DIR="/home/jenkins/openssl-output/${ANDROID_ABI}"
          EXTRA_CMAKE_ARGS=""
          if [ -n "${KEYCARD_QT_LOCAL_PATH:-}" ]; then
            EXTRA_CMAKE_ARGS="-DKEYCARD_QT_SOURCE_DIR=$KEYCARD_QT_LOCAL_PATH"
          fi
          mkdir -p build-android && cd build-android
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ env.ANDROID_ABI }} \
            -DANDROID_PLATFORM=android-26 \
            -DQT_HOST_PATH="${{ env.QT_HOST_PATH }}" \
            -DCMAKE_PREFIX_PATH="${{ env.QT_ANDROID_PATH }}" \
            -DCMAKE_FIND_ROOT_PATH="${{ env.QT_ANDROID_PATH }}" \
            -DQt6_DIR="${{ env.QT_ANDROID_PATH }}/lib/cmake/Qt6" \
            -DQt6CoreTools_DIR="${{ env.QT_HOST_PATH }}/lib/cmake/Qt6CoreTools" \
            -DBUILD_TESTING=OFF \
            -DOPENSSL_CRYPTO_LIBRARY="${OPENSSL_DIR}/lib/libcrypto.a" \
            -DOPENSSL_BUILD_INCLUDE_DIR="${OPENSSL_DIR}/include" \
            -DOPENSSL_SOURCE_INCLUDE_DIR="${OPENSSL_DIR}/include" \
            $EXTRA_CMAKE_ARGS
          cmake --build . -j$(nproc)

      - name: Verify artifacts
        run: find build-android -name 'libstatus-keycard-qt.*'
